name: .NET CI

on:
  push:
    branches:
      - main
      - master
      - tb-**
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "11 - SportsStore - 5/End of Chapter/SportsSln/SportsSln.sln"

      - name: Build solution
        run: dotnet build "11 - SportsStore - 5/End of Chapter/SportsSln/SportsSln.sln" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "11 - SportsStore - 5/End of Chapter/SportsSln/SportsSln.sln" --configuration Release --no-build --verbosity normal
